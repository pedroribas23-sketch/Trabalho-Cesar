services:
  - type: web
    name: kennedito-api
    runtime: node
    plan: free
    rootDir: back
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: AUTO_MIGRATE
        value: "true"
      - key: SESSION_DAYS
        value: "30"
      - key: BCRYPT_ROUNDS
        value: "12"
      # Troque pelo dominio do seu front (ou deixe * em desenvolvimento).
      - key: CORS_ORIGIN
        value: "*"
      # Banco no Neon (project "kennedito", branch "main").
      # Use a POOLED connection string: ela passa pelo pooler do Neon.
      # sync: false -> o Render pede o valor no momento do deploy, e a
      # senha do banco NUNCA fica no GitHub.
      - key: DATABASE_URL
        sync: false
      # O Neon exige SSL na conexao.
      - key: DATABASE_SSL
        value: "true"
