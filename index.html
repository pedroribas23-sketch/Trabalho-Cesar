<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#050b08">
  <title>Kennedito: A Escola Que Nunca Morre</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23071a12'/%3E%3Ccircle cx='16' cy='13' r='7' fill='%2358ff9d'/%3E%3Cellipse cx='16' cy='13' rx='9' ry='3' fill='%232ea96e'/%3E%3Ccircle cx='13' cy='12' r='1.6' fill='%23071a12'/%3E%3Ccircle cx='19' cy='12' r='1.6' fill='%23071a12'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="front/css/style.css">
  <style>
    /* Tela de carregamento enquanto o jogo entra em front/ */
    html, body { margin: 0; height: 100%; background: #030806; color: #b8ffd6;
      font-family: "Lucida Console", monospace; }
    #boot { height: 100%; display: flex; flex-direction: column; gap: 18px;
      align-items: center; justify-content: center; text-align: center; padding: 24px; }
    #boot h1 { margin: 0; font-size: clamp(20px, 5vw, 40px); color: #d9ffe9; letter-spacing: 2px; }
    #boot p { margin: 0; font-size: 14px; color: #7fbf9d; line-height: 1.7; }
    #boot a { color: #8affc1; }
    #bar { width: min(280px, 70vw); height: 6px; background: #0d1a14; overflow: hidden; border-radius: 3px; }
    #bar span { display: block; height: 100%; width: 40%; background: #58ff9d;
      animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="boot">
    <h1>KENNEDITO</h1>
    <p>A Escola Que Nunca Morre</p>
    <div id="bar"><span></span></div>
    <p>Carregando o corredor…</p>
    <p><a href="front/index.html">Entrar no jogo</a></p>
  </div>
  <script>
    // O jogo vive em front/. Se o navegador abriu esta pagina na raiz,
    // seguimos direto para ele.
    (function () {
      var target = 'front/index.html';
      var here = location.pathname.replace(/[^/]+$/, '');
      location.replace(here + target);
    })();
  </script>
</body>
</html>
