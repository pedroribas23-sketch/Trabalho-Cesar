services:
  - type: web
    name: kennedito-api
    runtime: node
    plan: free
    rootDir: back
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: AUTO_MIGRATE
        value: "true"
      - key: SESSION_DAYS
        value: "30"
      - key: BCRYPT_ROUNDS
        value: "12"
      # Troque pelo domínio do seu front (ou deixe * em desenvolvimento).
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: kennedito-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"

databases:
  - name: kennedito-db
    plan: free
    databaseName: kennedito
    user: kennedito
    postgresMajorVersion: "16"
